[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "your-project-name"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # add your actual deps here, e.g.:
    # "langchain",
    # "networkx",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true